name: CI - Validate & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON files
        run: |
          for file in data/*.json manifest.json; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "ERROR: $file is not valid JSON"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check file sizes
        run: |
          echo "=== File sizes ==="
          find . -type f -not -path './.git/*' -not -path './.github/*' -exec ls -lh {} \; | awk '{print $5, $9}'
          echo ""
          echo "=== Total size ==="
          du -sh --exclude=.git --exclude=.github .

      - name: Check PWA requirements
        run: |
          echo "Checking manifest.json..."
          test -f manifest.json && echo "OK" || (echo "ERROR: manifest.json missing" && exit 1)
          echo "Checking service worker..."
          test -f sw.js && echo "OK" || (echo "ERROR: sw.js missing" && exit 1)
          echo "Checking icons..."
          test -f icons/icon-192.png && echo "OK" || (echo "ERROR: icon-192.png missing" && exit 1)
          test -f icons/icon-512.png && echo "OK" || (echo "ERROR: icon-512.png missing" && exit 1)

      - name: Validate HTML structure
        run: |
          if ! grep -q '<!DOCTYPE html>' index.html; then
            echo "ERROR: Missing DOCTYPE"
            exit 1
          fi
          if ! grep -q '</html>' index.html; then
            echo "ERROR: Missing closing html tag"
            exit 1
          fi
          echo "HTML structure OK"

      - name: Check JS files exist
        run: |
          for file in js/*.js; do
            test -f "$file" && echo "OK: $file" || (echo "ERROR: $file missing" && exit 1)
          done

      - name: Generate summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JSON validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| PWA requirements | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML structure | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| JS files | ✅ |" >> $GITHUB_STEP_SUMMARY
